[package]
name = "rust-exports-native"
description = "What a Rust crate can export to TSX: a component, a module and a class (examples/rust-exports)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nsh-core.workspace = true

# The headless test runs `App.tsx` against this crate's set: the bundler
# compiles it, the engine runs it on QuickJS.
[dev-dependencies]
crossbeam-channel.workspace = true
log.workspace = true
nsh-bundler = { workspace = true, features = ["bundle"] }
nsh-engine = { workspace = true, features = ["js"] }
nsh-js.workspace = true
nsh-ui-mobile.workspace = true
