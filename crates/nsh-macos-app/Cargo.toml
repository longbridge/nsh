[package]
name = "nsh-macos-app"
description = "Release app runner on macOS: the executable of packaged nsh apps (no development features)."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js"]
# JS apps (the bundle in the app's resources). Without it the runner runs a
# Rust app only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-macos/js"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
serde_json.workspace = true
