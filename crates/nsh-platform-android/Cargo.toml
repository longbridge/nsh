[package]
name = "nsh-platform-android"
description = "Android backend: JNI glue, StaticLayout text engine, mount batch encoding, native animation driver."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "nsh"
crate-type = ["cdylib", "rlib"]

[features]
default = ["js"]
# JS apps (bundles, signed packages); without it, the library only runs a
# Rust app and links no QuickJS.
js = ["nsh-engine/js"]
# Development support: dev server client, log forwarding, error overlay.
dev = ["js", "dep:nsh-dev"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
nsh-core.workspace = true
nsh-engine.workspace = true
nsh-ui-mobile.workspace = true
serde_json.workspace = true
nsh-animation.workspace = true
rustc-hash.workspace = true
ttf-parser.workspace = true
libc.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
