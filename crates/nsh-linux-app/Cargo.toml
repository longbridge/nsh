[package]
name = "nsh-linux-app"
description = "Release app runner on Linux: the executable of packaged nsh apps (no development features)."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js", "webview"]
# JS apps (the bundle in the package). Without it the runner runs a Rust
# app only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-linux/js"]
# Web views (WebKitGTK 6.0): `libwebkitgtk-6.0-dev` to build, and packaged
# apps then need `libwebkitgtk-6.0-4` to start; off, a web view shows a
# placeholder and the runner needs only GTK 4.
webview = ["nsh-platform-linux/webview"]

[dependencies]
log.workspace = true

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
nsh-platform-linux.workspace = true
serde_json.workspace = true
