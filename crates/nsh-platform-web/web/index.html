<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nsh player</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #000; } }
  #app { position: fixed; inset: 0; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #8a8a8e; }
</style>
</head>
<body>
<div id="app"></div>
<div id="status">Loading…</div>
<script type="module">
  // Runs website demo `#<name>` (demos/<name>.js, bundled by `nsh build`).
  // `?theme=dark|light` overrides the system appearance.
  //
  // `?playground`: loads the runtime with the TSX compiler and runs the
  // source the embedding page posts: `{ type: "run", source }`. It posts
  // back `{ type: "ready" }` once loaded, `{ type: "compiled", error }`
  // after each run (`error` null when it compiled), and `{ type:
  // "runtime-error", message }` / `{ type: "log", level, message }` while
  // the app runs.
  import { createPlayer } from "./nsh.js";

  const status = document.getElementById("status");
  const params = new URLSearchParams(location.search);
  const playground = params.has("playground");
  const theme = params.get("theme");
  const post = (message) => parent !== window && parent.postMessage({ source: "nsh-player", ...message }, "*");
  const options = {
    assetBase: new URL("assets/", location.href).href,
    wasm: playground ? "./nsh-playground.wasm" : "./nsh.wasm",
    onError: (message) => post({ type: "runtime-error", message }),
    onLog: (level, message) => post({ type: "log", level, message }),
  };
  if (theme === "dark" || theme === "light") options.dark = theme === "dark";
  if (options.dark) document.documentElement.style.background = "#000";

  let loading;
  const player = () => (loading ??= createPlayer(document.getElementById("app"), options).then((p) => (window.player = p)));

  async function start() {
    const name = decodeURIComponent(location.hash.slice(1)) || "counter";
    status.textContent = "Loading…";
    status.style.display = "";
    try {
      const [p, code] = await Promise.all([
        player(),
        fetch(`demos/${encodeURIComponent(name)}.js`).then((r) => {
          if (!r.ok) throw new Error(`no demo named “${name}”`);
          return r.text();
        }),
      ]);
      status.style.display = "none";
      // A demo built split loads its chunks from next to it.
      p.run(code, { chunkBase: new URL("demos/", location.href).href });
    } catch (err) {
      status.textContent = String(err.message ?? err);
    }
  }

  addEventListener("message", async (e) => {
    const data = e.data ?? {};
    // The embedding page can switch the appearance: postMessage({ theme }).
    const t = data.theme;
    if ((t === "dark" || t === "light") && window.player) {
      document.documentElement.style.background = t === "dark" ? "#000" : "#fff";
      window.player.setDark(t === "dark");
    }
    if (playground && data.type === "run" && typeof data.source === "string") {
      const p = await player();
      status.style.display = "none";
      post({ type: "compiled", error: p.runSource(data.source, data.name ?? "App.tsx") });
    }
  });

  if (playground) {
    player().then(
      () => {
        status.textContent = "";
        post({ type: "ready" });
      },
      (err) => {
        status.textContent = String(err.message ?? err);
      },
    );
  } else {
    addEventListener("hashchange", start);
    start();
  }
</script>
</body>
</html>
