[package]
name = "nsh-js"
description = "QuickJS host: runtime setup, host APIs, op decoding and bytecode."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# A VM without QuickJS' parser and compiler (they are left out of the
# binary): it runs bytecode only. The web runtime of published apps.
bytecode-only = []

[dependencies]
serde_json.workspace = true
log.workspace = true
nsh-core.workspace = true
nsh-animation.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
percent-encoding.workspace = true
url.workspace = true


# Native targets run quickjs-jit (`rquickjs-jit`, which `lib.rs` names
# `rquickjs`) with LLRT's standard modules; its bindings are generated for
# the Apple and Android targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs-jit = { workspace = true, features = ["bindgen"] }
quickjs-jit-stdlib = { workspace = true, features = ["url"] }
# The heap's allocator: the system's `malloc` (as QuickJS's own).
libc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "sync", "io-util", "macros"] }
futures-util.workspace = true
tokio-tungstenite.workspace = true

# The browser runs upstream rquickjs: the same QuickJS-NG, without the JIT
# and without LLRT's standard modules.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rquickjs.workspace = true

[dev-dependencies]
brotli.workspace = true
flate2.workspace = true
zstd.workspace = true
nsh-ui-mobile.workspace = true
