[package]
name = "nsh-js"
description = "QuickJS host: runtime setup, host APIs, op decoding and bytecode."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# A VM without QuickJS' parser and compiler (they are left out of the
# binary): it runs bytecode only. The web runtime of published apps.
bytecode-only = []

[dependencies]
serde_json.workspace = true
log.workspace = true
nsh-core.workspace = true
nsh-animation.workspace = true
rquickjs.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
percent-encoding.workspace = true
url.workspace = true
llrt_buffer.workspace = true
llrt_crypto.workspace = true
llrt_path.workspace = true
llrt_events.workspace = true
llrt_assert.workspace = true
llrt_util.workspace = true
llrt_string_decoder.workspace = true
llrt_zlib.workspace = true


# Bindings are generated for the Apple and Android targets; WebAssembly uses
# rquickjs' pregenerated ones (its bindgen run misses `JS_ToCStringLen2` there).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
llrt_url.workspace = true
rquickjs = { workspace = true, features = ["bindgen"] }
# The heap's allocator: the system's `malloc` (as QuickJS's own).
libc.workspace = true
cap-std.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "sync", "io-util", "macros"] }
futures-util.workspace = true
tokio-tungstenite.workspace = true

# LLRT crypto uses rand 0.10/getrandom 0.4; browsers supply secure entropy.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom04 = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
nsh-ui-mobile.workspace = true
