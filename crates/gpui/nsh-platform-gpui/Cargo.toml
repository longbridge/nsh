[package]
name = "nsh-platform-gpui"
description = "GPUI backend (macOS, Windows, Linux): nsh apps drawn by GPUI, embeddable in GPUI and GPUI Kit apps."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js", "webview", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "svg", "net"]
# JS apps (bundles, signed packages); without it, the library only runs a
# Rust app and links no QuickJS.
js = ["nsh-engine/js-core"]
# Development support: dev server client, log forwarding, error overlay.
dev = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "svg", "net", "dep:nsh-dev", "dep:nsh-testing"]
# Shaders (`Shader`, `ShaderEffect`, `ShaderTransition`, the shader transitions
# of pages and dialogs), on naga and wgpu. Without it they draw nothing.
shader = ["nsh-engine/shader"]
# The large parts of `nsh/base`: see `docs/dev/features.md`. An app that imports
# one its runtime was built without fails at the import, naming it.
# `Editor` and `DiffView`, with ropey and imara-diff.
editor = ["nsh-base/editor"]
# `RichEditor`, its schema, session and plugin classes.
rich-editor = ["nsh-base/rich-editor"]
# The charts: `nsh/base/plot`.
plot = ["nsh-base/plot"]
# `Terminal` and its emulator: `vte`.
term = ["nsh-base/term"]
# Highlighted code in `TextView` and the `Editor` (syntect). Without it, plain.
highlight = ["nsh-base/highlight"]
# `TextView`'s formulas typeset natively (RaTeX and the KaTeX fonts). Without
# it a formula shows as its TeX, or as the app's `renderMath`.
math = ["nsh-base/math"]
# `EmojiPicker`, with Unicode's emoji and their English names (about 440 kB).
emoji-picker = ["nsh-base/emoji-picker"]
# The standard JS module `zlib`: deflate, gzip, brotli and zstd.
zlib = ["js", "nsh-engine/zlib"]
# The standard JS module `crypto` and the globals of Web Crypto.
crypto = ["js", "nsh-engine/crypto"]
# Screenshots on macOS and Windows (`nsh test --target gpui`'s): GPUI
# renders the window's frame offscreen (its `test-support`; development
# hosts only).
shot = ["gpui/test-support", "gpui_platform/test-support"]
# Compile GPUI's Metal shaders at run time (macOS), so building needs no Metal
# Toolchain (`xcodebuild -downloadComponent MetalToolchain`).
runtime-shaders = ["gpui_platform/runtime_shaders"]
# Web views (wry; on Linux GTK 3 and WebKitGTK 4.1, on an X11 window).
webview = ["dep:wry", "dep:gtk", "dep:webkit2gtk"]
# Videos (GStreamer 1.20+ with its base and good plug-ins; libav for most
# codecs).
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

# The native WebSocket client (tokio-tungstenite, rustls). Without it
# `connect` of `websocket` rejects with ERR_FEATURE_UNAVAILABLE_ON_PLATFORM.
websocket = ["nsh-core/websocket"]
# App self-updates (`nsh/updater`). Without it a check finds no update.
updater = ["nsh-core/updater"]
# SVG images (resvg). Without it an SVG is recognized and shows nothing.
svg = ["nsh-core/svg"]
# HTTP: `fetch` and remote images (ureq, rustls).
net = ["nsh-core/loader", "nsh-engine/net"]

[dependencies]
log.workspace = true

# Empty off the desktop (like the other platform crates off their targets).
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
nsh-core.workspace = true
nsh-engine.workspace = true
nsh-base.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { workspace = true, features = ["gif", "webp", "jpeg", "bmp", "ico", "tiff"] }
rustc-hash.workspace = true
tiny-skia.workspace = true
fontdb.workspace = true
serde_json.workspace = true
ttf-parser.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
anyhow.workspace = true
base64.workspace = true
crossbeam-channel.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }
wry = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's settings (XDG settings portal, AT-SPI).
zbus.workspace = true
# `shot` script steps read the window from the X server.
raw-window-handle.workspace = true
x11rb.workspace = true
gtk = { workspace = true, optional = true }
webkit2gtk = { workspace = true, optional = true }


# Views drawn by GPUI's headless renderer, read back as pixels.
[[test]]
name = "render"
required-features = ["shot"]
# Its own `main`: the macOS platform (its text system) is made on the main
# thread.
harness = false

# A whole app: tests do not build it.
[[example]]
name = "embed"
test = false

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
windows-sys.workspace = true

# Tests in windows of GPUI's test platform (feature `shot`) compile
# their apps.
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dev-dependencies]
nsh-bundler.workspace = true
gpui = { workspace = true, features = ["test-support"] }
