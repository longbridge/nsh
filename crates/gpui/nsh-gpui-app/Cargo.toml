[package]
name = "nsh-gpui-app"
description = "Release app runner on GPUI (macOS, Windows, Linux): the executable of packaged nsh apps (no development features)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["js"]
# JS apps (the bundle in the package). Without it the runner runs a Rust
# app only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-gpui/js"]

[dependencies]
log.workspace = true

# What packaged apps use: web views; videos on Linux (GStreamer).
# Never `dev` or `shot` (GPUI's test support) in the release runner.
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
nsh-platform-gpui = { workspace = true, features = ["webview"] }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-gpui = { workspace = true, features = ["webview", "video"] }
