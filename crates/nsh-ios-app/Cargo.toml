[package]
name = "nsh-ios-app"
description = "Release app runner: the executable of packaged nsh apps (no development features)."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "nsh-ios-app"
path = "src/main.rs"

[features]
default = ["js"]
# JS apps (the bundle in the app). Without it the runner runs a Rust app
# only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-ios/js"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true
