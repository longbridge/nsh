[package]
name = "nsh-platform-tui"
description = "Native Shell surfaces embedded in a terminal grid."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js"]
js = ["nsh-engine/js"]
run-app = []
dev = ["js", "dep:nsh-dev"]

[dependencies]
nsh-dev = { workspace = true, optional = true, features = ["client"] }
nsh-core.workspace = true
nsh-base.workspace = true
nsh-engine = { workspace = true, features = ["net"] }
ratatui-core.workspace = true
ratatui-widgets.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
crossbeam-channel.workspace = true
log.workspace = true

[dev-dependencies]
nsh-bundler.workspace = true
