[package]
name = "nsh-platform-tui"
description = "Native Shell surfaces embedded in a terminal grid."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js", "websocket", "updater", "net"]
js = ["nsh-engine/js"]
run-app = []
dev = ["js", "websocket", "updater", "dep:nsh-dev", "dep:nsh-testing", "dep:serde_json", "dep:ureq", "net"]

# The native WebSocket client (tokio-tungstenite, rustls). Without it
# `connect` of `websocket` rejects with ERR_FEATURE_UNAVAILABLE_ON_PLATFORM.
websocket = ["nsh-engine/websocket"]
# App self-updates (`nsh/updater`). Without it a check finds no update.
updater = ["nsh-engine/updater"]

# HTTP: `fetch` and remote images (ureq, rustls). Without it `fetch`
# rejects and an `<Image>` shows only files, assets and inline data.
net = ["nsh-engine/net"]

[dependencies]
nsh-dev = { workspace = true, optional = true, features = ["client"] }
nsh-testing = { workspace = true, optional = true, features = ["agent"] }
serde_json = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
nsh-core.workspace = true
nsh-base = { workspace = true, features = ["editor", "emoji-picker", "highlight", "plot", "rich-editor", "term"] }
nsh-engine.workspace = true
ratatui-core.workspace = true
ratatui-widgets.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
crossbeam-channel.workspace = true
log.workspace = true

[dev-dependencies]
nsh-bundler.workspace = true
