[package]
name = "nsh-core"
description = "Platform-independent core: shadow tree, styles, layout and mount instructions."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nsh-animation.workspace = true
rustc-hash.workspace = true
slab.workspace = true
taffy.workspace = true
serde_json.workspace = true
nsh-macros.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
log.workspace = true

# `net`'s sockets (`runtime/net.rs`); WebAssembly has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros"] }
# `process`'s children: their process groups and exits (`runtime/process.rs`).
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
