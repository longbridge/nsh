[package]
name = "nsh-core"
description = "Platform-independent core: shadow tree, styles, layout and mount instructions."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nsh-animation.workspace = true
rustc-hash.workspace = true
slab.workspace = true
taffy.workspace = true
serde.workspace = true
serde_json.workspace = true
nsh-macros.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
log.workspace = true

[dev-dependencies]
# The `unit_types` check reads the crate's public API.
syn = { workspace = true, features = ["visit"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
