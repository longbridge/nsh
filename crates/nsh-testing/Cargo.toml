[package]
name = "nsh-testing"
description = "Headless tests of nsh apps' TSX entries: built against the app's crates as nsh run builds them, run on an engine without a window."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nsh-bundler = { workspace = true, features = ["bundle"] }
nsh-core.workspace = true
nsh-engine = { workspace = true, features = ["js", "headless"] }
nsh-js.workspace = true
