[package]
name = "nsh-testing"
description = "Headless tests of nsh apps' TSX entries: built against the app's crates as nsh run builds them, run on an engine without a window."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["bundle"]
# Building entries in this process (`compile_tsx`, `tsx`, `compiler`): nsh's
# bundler. Off in apps' headless runners, which `nsh` builds the entries for.
bundle = ["dep:nsh-bundler", "dep:nsh-js"]

[dependencies]
nsh-bundler = { workspace = true, features = ["bundle"], optional = true }
nsh-core.workspace = true
nsh-engine = { workspace = true, features = ["js", "headless"] }
nsh-js = { workspace = true, optional = true }
crossbeam-channel.workspace = true
dunce.workspace = true
log.workspace = true
serde_json.workspace = true

[[test]]
name = "testing"
# It builds a test file's app in this process.
required-features = ["bundle"]
