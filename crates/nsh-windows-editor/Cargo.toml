[package]
name = "nsh-windows-editor"
description = "Prototype (#1644): `Editor` and `DiffView` as a module DLL on nsh-core.dll."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["dylib", "rlib"]

[features]
default = ["editor"]
# The sources' own gate: they are built here, not in `nsh/base`.
editor = []
# Not built: the core has no syntax highlighting either.
highlight = []

[target.'cfg(windows)'.dependencies]
nsh-windows-core = { path = "../nsh-windows-core" }
nsh-core.workspace = true
nsh-base = { workspace = true, default-features = false }
log.workspace = true
regex.workspace = true
rustc-hash.workspace = true
ropey.workspace = true
imara-diff.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
