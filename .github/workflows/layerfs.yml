name: LayerFS trial

# An opt-in experiment with real Git/Cargo and snapshot reuse. Run this on
# Linux before considering LayerFS for any required, cross-platform check.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layerfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test the local command
        run: python3 -B .github/ci/test_layerfs.py

      # LayerFS pins Docker API 1.54; hosted images can carry an older Engine.
      - uses: docker/setup-docker-action@v4
        id: docker
        with:
          version: v29.7.2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1

      - uses: Swatinem/rust-cache@v2
        with:
          key: layerfs-1.0.0
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build pinned LayerFS and the Rust runtime image
        run: ./scripts/layerfs prepare

      - name: Test Git, Cargo, snapshot reuse and branch isolation
        run: ./scripts/layerfs smoke --docker-socket '${{ steps.docker.outputs.sock }}'

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layerfs-receipts
          path: |
            .nsh/layerfs/deployment.json
            .nsh/layerfs/nsh-*/settings.json
            .nsh/layerfs/nsh-*/result.json
            .nsh/layerfs/nsh-*/trace.jsonl
          include-hidden-files: true
          if-no-files-found: warn
