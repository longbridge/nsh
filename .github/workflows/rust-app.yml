name: WebView cookie review
on: workflow_dispatch
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb xauth at-spi2-core
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          echo 'RUST_MIN_STACK=268435456' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/cargo
        with:
          cache: rust-app
      - name: Exercise native WebView APIs
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} .github/ci/webview-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookie-native-${{ runner.os }}
          path: .nsh/webview-review/proof/
          include-hidden-files: true
