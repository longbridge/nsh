name: Benchmarks

# Runs nsh-engine's micro benchmarks (the `#[ignore]` `bench_*` tests in
# crates/nsh-engine/tests/engine) for the pull request and for its merge base
# on main, on the same machine, and comments a comparison on the pull request.
# A metric more than 10% slower fails the check (scripts/bench-compare.py).
# Same-binary runs on the self-hosted runner move by at most 3% (a few
# nanoseconds on the fastest metrics, which the script's 2ns floor ignores).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - "crates/nsh-core/**"
      - "crates/nsh-engine/**"
      - "crates/nsh-js/**"
      - "crates/nsh-macros/**"
      - "crates/nsh-base/**"
      - "Cargo.lock"
      - "scripts/bench-compare.py"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: stable

jobs:
  compare:
    # Not for drafts, closed pull requests or forks (the comment needs a
    # write token, and forks run on GitHub's runners, too noisy to compare).
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) }}
    environment:
      name: ci-debounce
      deployment: false
    # A self-hosted runner takes one job at a time, so nothing else runs
    # beside the benchmarks.
    runs-on: ["public", "Linux", "X64"]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev jq

      - name: Setup Rust (self-hosted)
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          export PATH="$bin:$PATH"
          command -v rustup || curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          rustup toolchain install stable --profile minimal
          echo "$bin" >> "$GITHUB_PATH"

      - name: Cargo
        uses: ./.github/actions/cargo
        with:
          cache: bench

      # Both sides build into one target directory, so the base only rebuilds
      # the crates the pull request changed.
      - name: Build
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          set -euo pipefail
          build() {
            cargo test --release -p nsh-engine --test engine --no-run --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .target.name == "engine" and .executable != null) | .executable'
          }
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          cp "$(build | tail -1)" "$RUNNER_TEMP/head"
          git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base HEAD "$BASE_REF")"
          cd "$RUNNER_TEMP/base"
          cp "$(build | tail -1)" "$RUNNER_TEMP/base-bin"
          git -C "$GITHUB_WORKSPACE" worktree remove --force "$RUNNER_TEMP/base"

      - name: Compare
        id: compare
        working-directory: crates/nsh-engine
        run: |
          python3 ../../scripts/bench-compare.py run "$RUNNER_TEMP/base-bin" "$RUNNER_TEMP/head" --rounds 5 --json "$RUNNER_TEMP/bench.json"
          set +e
          python3 ../../scripts/bench-compare.py table "$RUNNER_TEMP/bench.json" > "$RUNNER_TEMP/bench.md"
          echo "regressed=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, updated on every push.
      - name: Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          BODY_FILE: ${{ runner.temp }}/bench.md
        with:
          script: |
            const marker = '<!-- nsh-bench -->';
            const body = `${marker}\n${require('fs').readFileSync(process.env.BODY_FILE, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail on regression
        if: steps.compare.outputs.regressed != '0'
        run: |
          echo "::error::A benchmark is more than 10% slower than main; see the job summary."
          exit 1
