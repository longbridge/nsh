name: Website

# Builds the documentation site with its live demos (the WebAssembly runtime,
# `cargo xtask web`) and publishes it to GitHub Pages at nsh.dev, every
# version of it (`website/scripts/versions.js`): the latest release at /, main
# at /versions/main, earlier releases at /versions/<tag>
# (`website/public/CNAME`). App Stories (/apps) come from the reviewed
# catalog in longbridge/nsh-showcases, whose own workflow dispatches this one
# after each merge and its weekly star refresh. Languages other than English
# and Chinese come from longbridge/nsh-website-translates, also at publish time.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "crates/**"
      - "examples/gallery/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "skills/**"
      - "examples/tasks/**"
      - "examples/tasks-rs/**"
      - "crates/nsh-platform-web/**"
      - "examples/gallery/**"
      - ".github/workflows/website.yml"
  merge_group:
    types: [checks_requested]
  # A release puts its documentation at the root. (The release the Release
  # workflow publishes with GITHUB_TOKEN starts no workflow itself.)
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages takes one deployment at a time; queue rather than cancel, so the
# latest push always ends up deployed.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  # CI builds each crate once: no incremental state and no debug info
  # (faster builds, smaller caches; panics still name their file and line).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The toolchain file's iOS and Android targets are only the release's.
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Pushes the releases' players to the `website-versions` branch.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The releases' tags and content (`website/scripts/versions.js`).
          fetch-depth: 0

      # The web runtime's C code (zstd): clang compiles it for wasm32 (llvm-ar
      # archives it); bindgen needs libclang for the host build of the nsh CLI.
      - name: Install clang and LLVM
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Dependencies only: main's runs save it, pull requests restore it.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test browser scroll indicator behavior
        run: node --test crates/nsh-platform-web/web/scroll.test.mjs

      - name: Test the player's dialogs, input and host channel
        run: node --test crates/nsh-platform-web/web/nsh.test.mjs

      - name: Test viewport dialogs across iframe boundaries
        run: node --test crates/nsh-platform-web/web/viewport-browser.test.mjs

      # Only the emoji test for now: summed tabular digits measure wider than
      # Chrome on Linux draws them (the file's first test).
      - name: Test emoji measurement against what Chrome draws
        run: node --test --test-name-pattern emoji crates/nsh-platform-web/web/text-browser.test.mjs

      - name: Test browser JavaScript bindings against Wasm
        env:
          AR_wasm32_unknown_unknown: llvm-ar
        run: |
          cargo build -p nsh-platform-web --target wasm32-unknown-unknown --no-default-features --features browser-tests --profile web
          NSH_BROWSER_WASM=target/wasm32-unknown-unknown/web/nsh_platform_web.wasm node --expose-gc --test crates/nsh-platform-web/web/browser/*.test.mjs

      - name: Test browser module lifecycle
        run: |
          python3 -m venv "$RUNNER_TEMP/nsh-browser-tests"
          "$RUNNER_TEMP/nsh-browser-tests/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/nsh-browser-tests/bin/python" -m playwright install --with-deps chromium
          CHROME=$("$RUNNER_TEMP/nsh-browser-tests/bin/python" -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          "$RUNNER_TEMP/nsh-browser-tests/bin/python" crates/nsh-platform-web/web/browser/browser-check.py --chrome "$CHROME" --wasm target/wasm32-unknown-unknown/web/nsh_platform_web.wasm

      # The published site requires the catalog (NSH_REQUIRE_SHOWCASES).
      - name: Check out the App Stories catalog
        uses: actions/checkout@v4
        with:
          repository: longbridge/nsh-showcases
          ref: main
          path: .showcases
          persist-credentials: false

      - name: Install the catalog's dependencies
        working-directory: .showcases
        run: bun install --frozen-lockfile

      - name: Install website dependencies
        working-directory: website
        run: bun install

      # `build` runs `cargo xtask web` first: nsh.wasm, the player and every
      # demo in website/demos, into website/public/play, and the gallery
      # published with `nsh package --target web` into play/gallery.
      - name: Build website
        working-directory: website
        env:
          NSH_REQUIRE_PLAY: "1"
          NSH_REQUIRE_SHOWCASES: "1"
          SHOWCASES_DIR: ${{ github.workspace }}/.showcases
          AR_wasm32_unknown_unknown: llvm-ar
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build

      - name: Test website
        working-directory: website
        env:
          SHOWCASES_DIR: ${{ github.workspace }}/.showcases
        run: bun run test

      # Each release's player (its `cargo xtask web`, ~15 minutes a tag) is
      # built once and kept on the orphan branch `website-versions`, which,
      # unlike the Actions cache, the Rust caches cannot evict. The releases'
      # pages, rebuilt whenever the site changes, stay in the cache.
      - name: Restore the releases' players
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          mkdir -p website/.versions
          if git fetch --depth=1 origin website-versions:refs/remotes/origin/website-versions; then
            git archive origin/website-versions | tar -x -C website/.versions
          fi

      - name: Restore the releases' pages
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/cache/restore@v4
        with:
          path: website/.versions
          key: website-versions-${{ github.run_id }}
          restore-keys: website-versions-

      # Machine translations, for the root only; none yet is fine.
      - name: Take the machine translations
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          git clone --depth=1 https://github.com/longbridge/nsh-website-translates website/translations
          rm -rf website/translations/.git

      # The published site, after the tests of main's own build: main again
      # at /versions/main, the releases from their tags (whose pages are as
      # they were released, links included).
      - name: Build every version
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        working-directory: website
        env:
          NSH_REQUIRE_SHOWCASES: "1"
          SHOWCASES_DIR: ${{ github.workspace }}/.showcases
          AR_wasm32_unknown_unknown: llvm-ar
          NSH_REQUIRE_RELEASES: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/versions.js

      - name: Save the releases' pages
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/cache/save@v4
        with:
          path: website/.versions
          key: website-versions-${{ github.run_id }}

      # Only a new release adds to the branch: one commit with its player.
      - name: Save the releases' players
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          branch="$RUNNER_TEMP/website-versions"
          if git rev-parse -q --verify refs/remotes/origin/website-versions >/dev/null; then
            git worktree add "$branch" -B website-versions origin/website-versions
          else
            git worktree add --orphan -b website-versions "$branch"
          fi
          for play in website/.versions/v*/play; do
            tag=$(basename "$(dirname "$play")")
            [ -f "$play/index.html" ] && [ ! -e "$branch/$tag/play" ] || continue
            mkdir -p "$branch/$tag" && cp -R "$play" "$branch/$tag/play"
          done
          cd "$branch"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Keep the players of $(git diff --cached --name-only | cut -d/ -f1 | sort -u | tr '\n' ' ')"
          # A concurrent run may have pushed first; its players are the same.
          git push origin website-versions || echo "::warning::website-versions not updated"

      - name: Check standalone Gallery code size
        run: node crates/nsh-platform-web/web/browser/package-size.mjs website/public/play/gallery --require-browser --brotli-budget=4100000

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
