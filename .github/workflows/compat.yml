name: Compat

# Holds the checkout to what NSH's releases froze: runs
# longbridge/nsh-compat (the record of each compatible release and the
# checks, kept apart so no change here can rewrite them) against it, as
# `cargo xtask compat` does: the apps of `tests/compat/` built by this
# checkout's `nsh` and run, every recorded release's API still offered and
# its apps still running (docs/dev/compatibility.md).

on:
  push:
    branches: [main]
    paths:
      - "crates/nsh-base/**"
      - "crates/nsh-bundler/**"
      - "crates/nsh-cli/**"
      - "crates/nsh-core/**"
      - "crates/nsh-dev/**"
      - "crates/nsh-engine/**"
      - "crates/nsh-js/**"
      - "crates/nsh-macros/**"
      - "crates/nsh-package/**"
      - "crates/nsh-testing/**"
      - "tests/compat/**"
      - "examples/counter/**"
      - "examples/desktop/**"
      - "examples/gallery/**"
      - "examples/hopper/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/compat.yml"
  pull_request:
    paths:
      - "crates/nsh-base/**"
      - "crates/nsh-bundler/**"
      - "crates/nsh-cli/**"
      - "crates/nsh-core/**"
      - "crates/nsh-dev/**"
      - "crates/nsh-engine/**"
      - "crates/nsh-js/**"
      - "crates/nsh-macros/**"
      - "crates/nsh-package/**"
      - "crates/nsh-testing/**"
      - "tests/compat/**"
      - "examples/counter/**"
      - "examples/desktop/**"
      - "examples/gallery/**"
      - "examples/hopper/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI builds each crate once: no incremental state and no debug info
  # (faster builds, smaller caches; panics still name their file and line).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The toolchain file's iOS and Android targets are only the release's.
  RUSTUP_TOOLCHAIN: stable

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Side by side: nsh-compat's crates depend on `../nsh`.
      - uses: actions/checkout@v4
        with:
          path: nsh

      - uses: actions/checkout@v4
        with:
          repository: longbridge/nsh-compat
          path: nsh-compat

      # QuickJS is C (bindgen needs libclang).
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Dependencies only: main's runs save it, pull requests restore it.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nsh
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build nsh
        working-directory: nsh
        run: cargo build -p nsh-cli

      # The checkout's versions, so the cache serves both.
      - name: Check
        working-directory: nsh-compat
        run: |
          cp ../nsh/Cargo.lock .
          cargo test --target-dir ../nsh/target
